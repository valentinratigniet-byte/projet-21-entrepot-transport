# Généré par powerbi/exposures_dbt.py : un rapport Power BI = une exposure (lignage source -> rapport).
version: 2

exposures:
  - name: rapport_activite_clients
    label: "Activité clients"
    type: dashboard
    maturity: high
    description: "CA, voyages, marge et appairage par client (rapport Power BI `Activité clients.pbip`)."
    owner: {name: "Direction commerciale", email: data@transval.example}
    depends_on:
      - ref('dim_activite')
      - ref('dim_client')
      - ref('dim_date')
      - ref('dim_relation')
      - ref('fct_evenement_facture')
      - ref('fct_justification_attente')
      - ref('fct_justification_lavage')
      - ref('fct_voyage')
      - ref('parametres')
